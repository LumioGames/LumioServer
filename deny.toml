[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "warn"

[[licenses.clarify]]
name = "lumio-gen-canonical-serializer"
version = "=0.0.0"
expression = "Apache-2.0"
license-files = [{ path = "../../../LICENSE", hash = 0x4c044f78 }]

