command_edges = [
    "external-control-plane -> control-plane-adapter | trusted signed input",
    "control-plane-adapter -> maintenance-agent | VerifiedMaintenanceCommand",
    "maintenance-agent -> world-slot | QuiesceForMaintenance or Resume with SlotEpoch",
    "maintenance-agent -> session | KickRemaining",
    "maintenance-agent -> transport | Broadcast MaintenanceKick or Disconnect",
    "maintenance-agent -> release-agent | local PoolMemberTransition",
    "process -> world-slot | QuiesceForShutdown or ConfigActivation",
    "world-slot -> pacing | Start Pause Resume or StopPacing",
    "world-slot -> coreclr-host | native bootstrap and owner-thread managed entry",
    "world-slot -> persistence-host | PersistSnapshot AppendWal or Checkpoint",
    "world-slot -> session | IsolateSession with Runtime witness",
    "session -> auth | Authenticate or Authorize",
    "session -> release-agent | MatchRelease",
    "session -> world-slot | Reserve Bind or ReleaseSession",
    "session -> transport | Bind Unbind or Disconnect",
    "timer-owner -> host-runtime | RegisterTimer or Cancel",
]

event_edges = [
    "transport -> world-slot | IngressBatch owner-thread pull",
    "transport -> session | HandshakeReady or ConnectionClosed with epoch",
    "pacing -> world-slot | TickPermit and pacing health",
    "coreclr-host -> world-slot | managed result ErrorCode and optional FaultClass witness",
    "world-slot -> session | GateStateChanged SlotFaulted or admission ack",
    "world-slot -> maintenance-agent | Quiesce progress ack with epoch",
    "world-slot -> process | shutdown progress or ReadyToStop",
    "session -> maintenance-agent | DrainProgress or terminal ack",
    "persistence-host -> world-slot | CommitAck or DiskPressure",
    "persistence-host -> maintenance-agent | PersistenceCommitAck",
    "observability -> maintenance-agent | AuditDurableAck or AuditBackpressure",
    "observability -> world-slot | AuditBackpressure",
    "auth -> transport | ReplayStorm through process typed bridge",
    "host-runtime -> timer-owner | TimerFired to owner inbox",
    "host-runtime -> process | TaskPanicked or supervision terminal",
    "maintenance-agent -> control-plane-adapter | Progress or ReadyToExit",
    "release-agent -> control-plane-adapter | Health or Identity",
    "process -> control-plane-adapter | lifecycle or exit evidence",
    "control-plane-adapter -> external-control-plane | local status or evidence",
]

