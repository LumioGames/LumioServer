name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification
        run: |
          node .spec/tools/spec-lint.mjs
          node --test .spec/tools/spec-lint.test.mjs
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          test -s docs/architecture/LumioGameEngine_Architecture_v1.4.md
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## Source / Compile-Time Dependencies$' README.md
          grep -q '^## Headless Test Surface$' README.md
          grep -q '^# LumioGameEngine V3 (v1.4)' docs/architecture/LumioGameEngine_Architecture_v1.4.md
          grep -q 'LGE-V1.4-2026-08-27' README.md
          grep -q 'LGE-V1.4-2026-08-27' docs/architecture/LumioGameEngine_Architecture_v1.4.md
          grep -q '^## 子模块' README.md
          grep -q '^## 当前阶段与开发节奏$' README.md
          test -s docs/architecture/.baseline.sha256
          sha256sum -c docs/architecture/.baseline.sha256

  mvp-host:
    name: MVP C# host policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: mvp-host/global.json
      - name: Validate mvp-host isolation
        working-directory: mvp-host
        run: bash eng/verify-isolation.sh
      - name: Validate mvp-host build and tests
        working-directory: mvp-host
        run: bash eng/verify-all.sh

  cargo-entity-chat:
    name: Cargo entity-chat acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cargo test lumio-host-runtime
        run: cargo test -p lumio-host-runtime --locked
        env:
          CARGO_TERM_COLOR: always
      - name: Cargo test lumio-server-process excluding 11-scenario
        run: cargo test -p lumio-server-process --locked --lib --bins --test entity_chat_architecture --test entity_chat_host --test entity_chat_wire
        env:
          CARGO_TERM_COLOR: always

  cargo-entity-chat-eleven:
    name: Cargo entity-chat 11-scenario
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Run 11-scenario (BLOCKED without Game root, never skip)
        run: cargo test -p lumio-server-process --locked --test entity_chat_acceptance -- --nocapture
        env:
          CARGO_TERM_COLOR: always
