[workspace]
resolver = "2"
members = [
    "crates/lumio-host-testkit",
    "generated/lumio-architecture-contracts",
    "modules/host-runtime",
    "modules/process",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ed25519-compact = { version = "2.1.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
